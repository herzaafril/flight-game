<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='none' stroke='%23ffd23e' stroke-width='2'/%3E%3C/svg%3E">
<title>Albatross Air Rally — a flight game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1522; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Albatross Air Rally: fly the Kestrel K-9 bush plane through rings, drop cargo on island villages, and land on the home runway"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
